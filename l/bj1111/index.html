<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}[hidden]{display:none!important}</style>
<title>给李宝晶的信</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Long+Cang&family=Ma+Shan+Zheng&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
/* layout: three full-screen scenes in sequence — airmail envelope → fountain-pen letter → ring of hearts */
:root{
  --night:#121831; --night2:#1f2957;
  --paper:#f3e6cc; --paper-shade:#e2cfa8; --sheet:#fbf4e4;
  --ink:#1f2a4d; --wax:#a3162a; --wax-hi:#d5414f; --wax-lo:#7a0e1e;
  --blue:#24408e; --red:#c8202f; --rose:#ff5d7a; --gold:#c9a35a;
  --shadow:rgba(0,0,0,.45);
  --script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --pen:"Long Cang","Kaiti SC","STKaiti","KaiTi",serif;
  --brush:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",serif;
  --caps:"Cormorant Garamond",Georgia,serif;
  color-scheme:dark;
}
html{box-sizing:border-box}
html,body{height:100%}
body{
  box-sizing:border-box; overflow:hidden; color:var(--paper);
  background:var(--night) radial-gradient(120% 90% at 50% 30%,var(--night2),var(--night) 70%);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.stage{position:relative;height:100%}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:20px;opacity:0;transition:opacity .8s}
.scene.on{opacity:1}
.hint{margin:0;font:400 20px/1.3 var(--pen);color:var(--paper);opacity:.85;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.4}}

/* ---------- envelope ---------- */
.env-wrap{width:min(100%,460px);aspect-ratio:3/2;perspective:1400px;flex:none}
.env{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.6,.1,.2,1)}
.env.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;box-shadow:0 18px 40px var(--shadow)}
.front{display:block;width:100%;height:100%;border:0;padding:10px;color:var(--ink);
  background:repeating-linear-gradient(-45deg,var(--blue) 0 14px,var(--paper) 14px 28px,var(--red) 28px 42px,var(--paper) 42px 56px)}
.front-in{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%;background:var(--paper);border-radius:2px;padding-top:26px;box-sizing:border-box}
.avion{position:absolute;left:12px;top:12px;border:1.5px solid var(--blue);color:var(--blue);font:600 11px/1 var(--caps);letter-spacing:.18em;padding:5px 8px}
.stamp{position:absolute;right:12px;top:12px;width:52px;height:64px;box-sizing:border-box;background:var(--blue);border:3px dotted var(--paper);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 8px/1 var(--caps);letter-spacing:.12em}
.stamp svg{width:20px;fill:var(--rose)}
.postmark{position:absolute;right:46px;top:38px;width:76px;height:76px;transform:rotate(-14deg);opacity:.55}
.to{font:400 clamp(22px,6vw,30px)/1 var(--script)}
.name{font:400 clamp(30px,9vw,44px)/1.15 var(--brush);letter-spacing:.08em}
.addr{font:600 12px/1.3 var(--caps);letter-spacing:.16em;text-transform:uppercase;opacity:.75}

.back{transform:rotateY(180deg);background:var(--paper-shade)}
.peek{position:absolute;z-index:1;left:8%;right:8%;top:8%;height:84%;background:var(--sheet);color:var(--ink);border-radius:2px;text-align:center;padding-top:16px;box-sizing:border-box;font:400 24px/1 var(--script);transition:transform 1.2s .55s cubic-bezier(.3,.7,.3,1)}
.pocket{position:absolute;z-index:2;inset:0;background:var(--paper);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:6px}
.folds{position:absolute;z-index:2;inset:0;width:100%;height:100%;pointer-events:none}
.flap{position:absolute;z-index:3;inset:0;background:linear-gradient(180deg,var(--paper-shade),var(--paper) 62%);clip-path:polygon(0 0,100% 0,50% 58%);transform-origin:top;transition:transform .9s ease-in-out,z-index 0s .45s;border-radius:6px}
.seal{position:absolute;z-index:4;left:50%;top:58%;width:64px;height:64px;margin:-32px 0 0 -32px;border:0;border-radius:50%;padding:0;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,var(--wax-hi),var(--wax) 62%);box-shadow:0 3px 8px var(--shadow),inset 0 0 0 5px rgba(0,0,0,.14);transition:transform .5s,opacity .5s}
.seal svg{width:26px;fill:var(--wax-lo)}
.flipped .seal{animation:nudge 1.6s 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.1)}}
.open .flap{transform:scaleY(-1);z-index:0}
.open .peek{transform:translateY(-54%)}
.open .seal{animation:none;transform:scale(1.6) rotate(25deg);opacity:0;pointer-events:none}

/* ---------- letter ---------- */
.paper{width:min(100%,520px);max-height:100%;overflow-y:auto;box-sizing:border-box;flex:0 1 auto;min-width:0;
  background:var(--sheet);color:var(--ink);padding:clamp(26px,7vw,44px);border-radius:3px;
  box-shadow:inset 0 0 0 7px var(--sheet),inset 0 0 0 8px var(--gold),0 18px 40px var(--shadow);
  display:flex;flex-direction:column;gap:14px}
.paper p{margin:0;font:400 clamp(21px,5.6vw,26px)/1.65 var(--pen)}
.paper .en{font:400 clamp(27px,7.4vw,36px)/1.2 var(--script)}
.paper .sign{text-align:right}
.ln{display:block;animation:write 1.2s both;animation-delay:var(--d,0s)}
@keyframes write{from{clip-path:inset(-15% 100% -15% -3%);opacity:.2}to{clip-path:inset(-15% -3% -15% -3%);opacity:1}}
.next{align-self:center;margin-top:6px;background:none;border:0;border-bottom:1px solid var(--ink);padding:2px 4px;color:var(--ink);font:400 22px/1.4 var(--pen)}

/* ---------- ring of hearts ---------- */
.float{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.f{position:absolute;bottom:-40px;left:var(--x);width:var(--s);fill:var(--rose);opacity:0;animation:rise var(--t) linear var(--n,infinite);animation-delay:var(--dl)}
@keyframes rise{0%{transform:translateY(0) rotate(-12deg);opacity:0}12%{opacity:.6}100%{transform:translateY(-115vh) rotate(16deg);opacity:0}}
.ring{--size:min(84vw,56vh,440px);position:relative;width:var(--size);height:var(--size);flex:none}
.h{position:absolute;left:50%;top:50%;width:calc(var(--size)*.085);margin:calc(var(--size)*-.04) 0 0 calc(var(--size)*-.0425);
  transform:rotate(var(--a)) translateY(calc(var(--size)*-.45)) rotate(calc(var(--a)*-1));
  opacity:0;animation:pop .5s forwards;animation-delay:calc(var(--i)*70ms + .7s)}
.h svg{display:block;width:100%;fill:var(--rose);animation:beat 1.44s infinite;animation-delay:calc(var(--i)*60ms)}
.h:nth-child(odd) svg{fill:var(--wax-hi)}
@keyframes pop{to{opacity:1}}
@keyframes beat{0%,30%,100%{transform:scale(1)}15%{transform:scale(1.4)}}
.core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--size)*.025);text-align:center}
.je{font:400 calc(var(--size)*.09)/1 var(--script);color:var(--gold)}
.big{font:400 calc(var(--size)*.115)/1.15 var(--brush);white-space:nowrap;color:var(--paper);text-shadow:0 0 26px rgba(255,93,122,.6)}
.big b{font-weight:400;color:var(--rose)}
.sub{font:400 calc(var(--size)*.062)/1.2 var(--pen);opacity:.85}
.acts{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.forgive{border:0;border-radius:999px;padding:8px 30px;background:var(--wax);color:var(--paper);font:400 24px/1.4 var(--pen);box-shadow:0 6px 18px var(--shadow)}
.sticker{position:relative;width:min(78vw,46vh,340px);height:auto;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.thanks{position:relative;margin:0;font:400 clamp(26px,7vw,34px)/1.3 var(--pen);color:var(--paper)}
.again{background:none;border:0;color:var(--paper);opacity:.6;font:400 17px/1.4 var(--pen);text-decoration:underline}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .f{display:none}
}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="heart" viewBox="0 0 32 30"><path d="M16 28C16 28 2 19 2 9.5 2 5 5.5 2 9.5 2 12.5 2 15 3.8 16 6 17 3.8 19.5 2 22.5 2 26.5 2 30 5 30 9.5 30 19 16 28 16 28Z"/></symbol>
</svg>

<main class="stage">

  <section class="scene on" id="s-env">
    <div class="env-wrap">
      <div class="env" id="env">
        <button class="face front" id="front" type="button" aria-label="翻开信封">
          <span class="front-in">
            <span class="avion">PAR AVION</span>
            <span class="stamp"><svg viewBox="0 0 32 30"><use href="#heart"/></svg><span>AMOUR</span><span>∞ F</span></span>
            <svg class="postmark" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <circle cx="40" cy="40" r="36"/><circle cx="40" cy="40" r="25"/>
              <text x="40" y="37" text-anchor="middle" font-size="10" font-family="Georgia,serif" fill="currentColor" stroke="none" letter-spacing="1.5">PARIS</text>
              <text x="40" y="50" text-anchor="middle" font-size="8" font-family="Georgia,serif" fill="currentColor" stroke="none">11·11·2026</text>
            </svg>
            <span class="to">À Madame</span>
            <span class="name">李宝晶</span>
            <span class="addr">Dans mon cœur · pour toujours</span>
          </span>
        </button>
        <div class="face back">
          <div class="peek">Pardonne-moi…</div>
          <div class="pocket"></div>
          <svg class="folds" viewBox="0 0 300 200" preserveAspectRatio="none" fill="none" stroke="#c9b48a" stroke-width="1" aria-hidden="true"><path d="M0 200 120 90M300 200 180 90"/></svg>
          <div class="flap"></div>
          <button class="seal" id="seal" type="button" aria-label="拆开信封" disabled><svg viewBox="0 0 32 30"><use href="#heart"/></svg></button>
        </div>
      </div>
    </div>
    <p class="hint" id="hint">老婆，有一封给你的信 · 轻点信封</p>
  </section>

  <section class="scene" id="s-letter" hidden>
    <article class="paper">
      <p class="en"><span class="ln" style="--d:.6s">My dearest Baojing,</span></p>
      <p><span class="ln" style="--d:1.6s">亲爱的老婆：</span></p>
      <p><span class="ln" style="--d:2.6s">对不起，这次是我不好，惹你生气了。</span></p>
      <p><span class="ln" style="--d:3.8s">我不该让你受委屈，更不该让你一个人难过。你不开心的每一分钟，我都在后悔。</span></p>
      <p><span class="ln" style="--d:5.2s">以后我会多听你说，少跟你犟；先抱抱你，再讲道理。</span></p>
      <p><span class="ln" style="--d:6.4s">原谅我，好不好？</span></p>
      <p class="en sign"><span class="ln" style="--d:7.4s">Forever yours,</span></p>
      <p class="sign"><span class="ln" style="--d:8.2s">永远爱你的老公</span></p>
      <button class="next ln" id="next" type="button" style="--d:9.2s">翻到下一页 ♥</button>
    </article>
  </section>

  <section class="scene" id="s-love" hidden>
    <div class="float" id="float"></div>
    <div class="ring" id="ring">
      <div class="core">
        <span class="je">Je t'aime</span>
        <span class="big"><b>爱</b>李宝晶🍐</span>
        <span class="sub" id="sub">老婆，原谅我好不好</span>
      </div>
    </div>
    <div class="acts">
      <button class="forgive" id="forgive" type="button">原谅你啦</button>
    </div>
  </section>

  <section class="scene" id="s-final" hidden>
    <div class="float" id="float2"></div>

    <div class="acts"><button class="again" id="again" type="button">再看一遍</button></div>

</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var env=$('env'),front=$('front'),seal=$('seal'),hint=$('hint');
  var sEnv=$('s-env'),sLetter=$('s-letter'),sLove=$('s-love');
  var HEART='<svg viewBox="0 0 32 30"><use href="#heart"/></svg>';

  function go(from,to){
    from.classList.remove('on');
    setTimeout(function(){
      from.hidden=true; to.hidden=false;
      requestAnimationFrame(function(){requestAnimationFrame(function(){to.classList.add('on')})});
    },800);
  }

  front.addEventListener('click',function(){
    env.classList.add('flipped');
    front.disabled=true; seal.disabled=false;
    hint.textContent='按一下火漆印，拆开它';
  });

  seal.addEventListener('click',function(){
    env.classList.add('open'); seal.disabled=true;
    hint.textContent='';
    setTimeout(function(){go(sEnv,sLetter)},2300);
  });

  // ring of hearts
  var ring=$('ring'),N=24,html='';
  for(var i=0;i<N;i++) html+='<span class="h" style="--i:'+i+';--a:'+(360/N*i)+'deg">'+HEART+'</span>';
  ring.insertAdjacentHTML('afterbegin',html);

  // drifting hearts
  var fl=$('float');
  function drift(n,once,box){
    var s='';
    for(var i=0;i<n;i++){
      s+='<svg class="f" viewBox="0 0 32 30" style="--x:'+(Math.random()*96).toFixed(1)+'%;--s:'+(12+Math.random()*22).toFixed(0)+'px;--t:'
        +(once?2.5+Math.random()*2.5:7+Math.random()*7).toFixed(1)+'s;--dl:'+(once?Math.random()*1.2:Math.random()*8).toFixed(1)+'s'
        +(once?';--n:1':'')+'"><use href="#heart"/></svg>';
    }
    (box||fl).insertAdjacentHTML('beforeend',s);
  }
  var sFinal=$('s-final'),fl2=$('float2');
  drift(16,false);
  drift(14,false,fl2);

  $('next').addEventListener('click',function(){go(sLetter,sLove)});

  var forgive=$('forgive'),sub=$('sub');
  forgive.addEventListener('click',function(){
    sub.textContent='谢谢老婆，我爱你 ♥';
    forgive.hidden=true;
    drift(40,true);
    setTimeout(function(){go(sLove,sFinal)},1800);
  });

  $('again').addEventListener('click',function(){
    go(sFinal,sEnv);
    setTimeout(function(){
      env.classList.remove('flipped','open');
      front.disabled=false; seal.disabled=true;
      hint.textContent='老婆，有一封给你的信 · 轻点信封';
      sub.textContent='老婆，原谅我好不好';
      forgive.hidden=false;
    },800);
  });
})();
</script>
